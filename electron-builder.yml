appId: com.dropletfiles.app
productName: Droplet Files
directories:
  output: dist
files:
  - out/**/*
  - package.json
npmRebuild: false
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Droplet Files
