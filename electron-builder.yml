appId: com.dropletfiles.app
productName: Droplet Files
copyright: Copyright © 2026 Droplet Files Contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: Droplet Files Setup ${version}.${ext}
  legalTrademarks: Droplet Files
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Droplet Files
  uninstallDisplayName: Droplet Files
  deleteAppDataOnUninstall: false
  # Unsigned builds trigger Windows SmartScreen — sign in CI for public releases.
